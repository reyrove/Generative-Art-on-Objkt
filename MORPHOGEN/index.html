<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MORPHOGEN</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #06080c;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }
    .canvas-container {
      border-radius: 24px;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.05);
      background: #0c0f16;
      padding: 16px;
    }
    canvas {
      display: block;
      width: 600px;
      height: 600px;
      border-radius: 16px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding: 0 6px;
      color: #8a94a8;
      font-size: 12px;
      letter-spacing: 0.4px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .meta .title {
      color: #d8e0f0;
      font-weight: 600;
      letter-spacing: 1px;
      font-size: 12px;
    }
    .badge {
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 14px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: #9aa6bc;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.3px;
      font-weight: 500;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    .refresh-btn, .download-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #c0cade;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      padding: 7px 20px;
      border-radius: 40px;
      transition: all 0.25s ease;
      letter-spacing: 0.4px;
    }
    .refresh-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }
    .download-btn {
      background: rgba(90, 180, 255, 0.1);
      border-color: rgba(90, 180, 255, 0.25);
      color: #a8d0ff;
    }
    .download-btn:hover {
      background: rgba(90, 180, 255, 0.2);
      border-color: rgba(90, 180, 255, 0.5);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .refresh-btn:active, .download-btn:active {
      transform: translateY(0px) scale(0.98);
    }
    .download-btn:disabled {
      opacity: 0.5;
      cursor: wait;
      transform: none;
    }
  </style>
</head>
<body>
  <div class="canvas-container">
    <canvas id="art" width="1200" height="1200"></canvas>
    <div class="meta">
      <span class="title">◆ CHROMATIC MORPHS</span>
      <span class="badge" id="seedLabel">SEED · 000000</span>
      <div class="btn-group">
        <button class="download-btn" id="downloadBtn">↓ download</button>
        <button class="refresh-btn" id="refreshBtn">↻ new seed</button>
      </div>
    </div>
  </div>
  <script>
    (function() {
      // Use let so we can swap canvas/ctx during high-res rendering
      let canvas = document.getElementById('art');
      let ctx = canvas.getContext('2d', { alpha: false });

      const BASE_W = 1200;
      const BASE_H = 1200;

      // =============================================
      //  PRNG (mulberry32) — deterministic per seed
      // =============================================
      function mulberry32(a) {
        return function() {
          a |= 0;
          a = a + 0x6D2B79F5 | 0;
          let t = Math.imul(a ^ a >>> 15, 1 | a);
          t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }

      function randRange(rng, min, max) {
        return min + rng() * (max - min);
      }

      function randInt(rng, min, max) {
        return Math.floor(randRange(rng, min, max + 1));
      }

      function pick(rng, arr) {
        return arr[Math.floor(rng() * arr.length)];
      }

      // =============================================
      //  COLOR PALETTE GENERATORS
      // =============================================
      function generatePalette(rng) {
        const strategy = pick(rng, ['analogous', 'complementary', 'triadic', 'split', 'monochrome', 'warm', 'cool']);

        const baseHue = rng() * 360;
        const palette = [];

        switch(strategy) {
          case 'analogous':
            for (let i = 0; i < 6; i++) {
              palette.push({
                h: (baseHue + i * 22 + rng() * 10) % 360,
                s: 55 + rng() * 40,
                l: 45 + rng() * 35
              });
            }
            break;
          case 'complementary':
            for (let i = 0; i < 6; i++) {
              const h = i < 3 ? baseHue + i * 12 : (baseHue + 180 + (i - 3) * 12);
              palette.push({
                h: (h + 360) % 360,
                s: 60 + rng() * 35,
                l: 48 + rng() * 30
              });
            }
            break;
          case 'triadic':
            for (let i = 0; i < 6; i++) {
              const h = baseHue + (i % 3) * 120 + Math.floor(i / 3) * 15;
              palette.push({
                h: (h + 360) % 360,
                s: 55 + rng() * 40,
                l: 45 + rng() * 35
              });
            }
            break;
          case 'split':
            for (let i = 0; i < 6; i++) {
              const offsets = [0, 150, 210, 0, 150, 210];
              palette.push({
                h: (baseHue + offsets[i] + rng() * 15) % 360,
                s: 58 + rng() * 35,
                l: 48 + rng() * 30
              });
            }
            break;
          case 'monochrome':
            for (let i = 0; i < 6; i++) {
              palette.push({
                h: baseHue,
                s: 20 + i * 12 + rng() * 10,
                l: 30 + i * 10 + rng() * 8
              });
            }
            break;
          case 'warm':
            for (let i = 0; i < 6; i++) {
              palette.push({
                h: (rng() * 60 + 320) % 360,
                s: 65 + rng() * 30,
                l: 50 + rng() * 30
              });
            }
            break;
          case 'cool':
            for (let i = 0; i < 6; i++) {
              palette.push({
                h: 170 + rng() * 100,
                s: 55 + rng() * 40,
                l: 48 + rng() * 32
              });
            }
            break;
        }

        const bgTypes = ['dark', 'deep', 'gradient-dark', 'cosmic'];
        const bgType = pick(rng, bgTypes);

        return { palette, baseHue, strategy, bgType };
      }

      // =============================================
      //  SHAPE CONFIG
      // =============================================
      function getShapeConfig(rng) {
        const style = pick(rng, [
          'polygon-rings',
          'star-burst',
          'mandala',
          'grid-geometry',
          'spiral-math',
          'fractal-lines',
          'wave-particles',
          'crystal-lattice'
        ]);

        return {
          style,
          ringCount: randInt(rng, 12, 28),
          starPoints: randInt(rng, 5, 12),
          waveCount: randInt(rng, 8, 22),
          latticeSize: randInt(rng, 10, 22),
          circleCount: randInt(rng, 25, 70),
          spiralTurns: randRange(rng, 2, 6),
          heroSides: randInt(rng, 3, 12),
          particleCount: randInt(rng, 150, 400),
          useGradientFill: rng() > 0.5,
          useGlow: rng() > 0.5,
          rotationSpeed: randRange(rng, 0.1, 0.8),
          symmetry: pick(rng, [4, 5, 6, 8, 10, 12]),
          lineWeight: randRange(rng, 0.6, 2.8)
        };
      }

      // =============================================
      //  DRAWING HELPERS (use module-scoped ctx)
      // =============================================
      function polygonPoints(cx, cy, radius, sides, rotation = 0) {
        const pts = [];
        for (let i = 0; i < sides; i++) {
          const angle = (i / sides) * Math.PI * 2 + rotation;
          pts.push({
            x: cx + Math.cos(angle) * radius,
            y: cy + Math.sin(angle) * radius
          });
        }
        return pts;
      }

      function starShapePoints(cx, cy, outerR, innerR, points, rotation = 0) {
        const pts = [];
        for (let i = 0; i < points * 2; i++) {
          const r = i % 2 === 0 ? outerR : innerR;
          const angle = (i / (points * 2)) * Math.PI * 2 + rotation;
          pts.push({
            x: cx + Math.cos(angle) * r,
            y: cy + Math.sin(angle) * r
          });
        }
        return pts;
      }

      function drawPolyPath(pts, close = true) {
        if (pts.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) {
          ctx.lineTo(pts[i].x, pts[i].y);
        }
        if (close) ctx.closePath();
      }

      function hsla(c, a = 1) {
        return `hsla(${c.h % 360}, ${c.s}%, ${c.l}%, ${a})`;
      }

      // =============================================
      //  MAIN ARTWORK GENERATOR
      //  Uses module-scoped `ctx` and `W`/`H` derived from ctx.canvas
      // =============================================
      function generateArt(seed) {
        const W = ctx.canvas.width;
        const H = ctx.canvas.height;
        const CX = W / 2;
        const CY = H / 2;

        const rng = mulberry32(seed);
        const { palette, baseHue, strategy, bgType } = generatePalette(rng);
        const config = getShapeConfig(rng);

        // ---------- BACKGROUND ----------
        if (bgType === 'dark') {
          ctx.fillStyle = '#080a10';
        } else if (bgType === 'deep') {
          ctx.fillStyle = `hsl(${baseHue}, 30%, 4%)`;
        } else if (bgType === 'cosmic') {
          ctx.fillStyle = '#05070d';
        } else {
          ctx.fillStyle = '#0a0d14';
        }
        ctx.fillRect(0, 0, W, H);

        // atmospheric gradient
        const atmGrad = ctx.createRadialGradient(
          CX + randRange(rng, -200, 200) * (W / BASE_W),
          CY + randRange(rng, -200, 200) * (H / BASE_H),
          50 * (W / BASE_W),
          CX, CY, W * 0.95
        );
        atmGrad.addColorStop(0, `hsla(${baseHue}, 40%, 12%, 0.6)`);
        atmGrad.addColorStop(0.6, `hsla(${(baseHue + 40) % 360}, 30%, 8%, 0.4)`);
        atmGrad.addColorStop(1, `hsla(${baseHue}, 20%, 4%, 0)`);
        ctx.fillStyle = atmGrad;
        ctx.fillRect(0, 0, W, H);

        // ============================================
        //  STYLE 1: POLYGON RINGS
        // ============================================
        if (config.style === 'polygon-rings' || rng() > 0.6) {
          const maxR = Math.min(W, H) * 0.46;
          const count = config.ringCount;

          for (let i = 0; i < count; i++) {
            const t = i / count;
            const radius = maxR * (0.08 + t * 0.92);
            const sides = 3 + Math.floor((i * 1.7 + rng() * 4) % 10);
            const rot = i * 0.15 + rng() * 0.8;
            const c = palette[i % palette.length];

            const pts = polygonPoints(CX, CY, radius, sides, rot);
            drawPolyPath(pts, true);

            ctx.strokeStyle = hsla(c, 0.12 + (1 - t) * 0.25);
            ctx.lineWidth = config.lineWeight * (1 + (1 - t) * 2) * (W / BASE_W);
            ctx.stroke();
          }
        }

        // ============================================
        //  STYLE 2: MANDALA
        // ============================================
        if (config.style === 'mandala' || rng() > 0.55) {
          const symmetry = config.symmetry;
          const layers = config.ringCount;

          for (let layer = 0; layer < layers; layer++) {
            const t = layer / layers;
            const radius = Math.min(W, H) * 0.08 + t * Math.min(W, H) * 0.42;
            const c = palette[layer % palette.length];

            for (let s = 0; s < symmetry; s++) {
              const angle = (s / symmetry) * Math.PI * 2 + t * config.rotationSpeed;

              const px = CX + Math.cos(angle) * radius * 0.7;
              const py = CY + Math.sin(angle) * radius * 0.7;

              const pts = [];
              const petalSize = radius * 0.4;
              for (let p = 0; p < 5; p++) {
                const pa = (p / 5) * Math.PI * 2 + angle;
                pts.push({
                  x: px + Math.cos(pa) * petalSize * (0.5 + rng() * 0.5),
                  y: py + Math.sin(pa) * petalSize * (0.5 + rng() * 0.5)
                });
              }

              drawPolyPath(pts, true);
              ctx.strokeStyle = hsla(c, 0.08 + t * 0.15);
              ctx.lineWidth = config.lineWeight * 0.8 * (W / BASE_W);
              ctx.stroke();
            }
          }
        }

        // ============================================
        //  STYLE 3: STAR BURST
        // ============================================
        if (config.style === 'star-burst' || rng() > 0.5) {
          const starCount = randInt(rng, 6, 14);
          const scaleF = W / BASE_W;

          for (let s = 0; s < starCount; s++) {
            const scx = randRange(rng, W * 0.15, W * 0.85);
            const scy = randRange(rng, H * 0.15, H * 0.85);
            const outer = randRange(rng, 80, 280) * scaleF;
            const inner = outer * randRange(rng, 0.25, 0.55);
            const points = config.starPoints;
            const rot = rng() * Math.PI * 2;
            const c = palette[s % palette.length];

            const pts = starShapePoints(scx, scy, outer, inner, points, rot);
            drawPolyPath(pts, true);

            ctx.strokeStyle = hsla(c, randRange(rng, 0.08, 0.2));
            ctx.lineWidth = config.lineWeight * randRange(rng, 0.8, 2) * scaleF;
            ctx.stroke();

            if (config.useGradientFill && rng() > 0.5) {
              const g = ctx.createRadialGradient(scx, scy, 10 * scaleF, scx, scy, outer);
              g.addColorStop(0, hsla(c, 0.06));
              g.addColorStop(1, hsla(c, 0));
              drawPolyPath(pts, true);
              ctx.fillStyle = g;
              ctx.fill();
            }
          }
        }

        // ============================================
        //  STYLE 4: GRID GEOMETRY
        // ============================================
        if (config.style === 'grid-geometry' || rng() > 0.55) {
          const size = config.latticeSize;
          const cellW = W / size;
          const cellH = H / size;

          for (let gy = 0; gy < size; gy++) {
            for (let gx = 0; gx < size; gx++) {
              const x0 = gx * cellW;
              const y0 = gy * cellH;
              const x1 = x0 + cellW;
              const y1 = y0 + cellH;

              const c = palette[(gx + gy) % palette.length];
              const alpha = randRange(rng, 0.03, 0.1);

              ctx.beginPath();
              if ((gx + gy) % 2 === 0) {
                ctx.moveTo(x0, y0);
                ctx.lineTo(x1, y0);
                ctx.lineTo(x0, y1);
                ctx.closePath();
              } else {
                ctx.moveTo(x1, y0);
                ctx.lineTo(x1, y1);
                ctx.lineTo(x0, y1);
                ctx.closePath();
              }
              ctx.strokeStyle = hsla(c, alpha);
              ctx.lineWidth = config.lineWeight * 0.6 * (W / BASE_W);
              ctx.stroke();
            }
          }
        }

        // ============================================
        //  STYLE 5: SPIRAL MATH
        // ============================================
        if (config.style === 'spiral-math' || rng() > 0.5) {
          const turns = config.spiralTurns;
          const spiralCount = randInt(rng, 3, 8);
          const phi = (1 + Math.sqrt(5)) / 2;
          const scaleF = W / BASE_W;

          for (let sp = 0; sp < spiralCount; sp++) {
            const offsetAngle = (sp / spiralCount) * Math.PI * 2;
            const c = palette[sp % palette.length];
            const scale = randRange(rng, 3, 8) * scaleF;

            ctx.beginPath();
            for (let i = 0; i <= 250; i++) {
              const t = i / 250;
              const angle = t * turns * Math.PI * 2 + offsetAngle;
              const r = Math.pow(phi, t * turns * 2.2) * scale;
              const x = CX + Math.cos(angle) * r;
              const y = CY + Math.sin(angle) * r;
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = hsla(c, 0.1 + sp * 0.03);
            ctx.lineWidth = config.lineWeight * 1.2 * scaleF;
            ctx.stroke();
          }
        }

        // ============================================
        //  STYLE 6: FRACTAL LINES
        // ============================================
        if (config.style === 'fractal-lines' || rng() > 0.6) {
          const lineCount = config.waveCount * 3;
          const scaleF = W / BASE_W;

          for (let i = 0; i < lineCount; i++) {
            const c = palette[i % palette.length];
            let x = randRange(rng, -100, W + 100);
            let y = randRange(rng, -100, H + 100);
            const steps = randInt(rng, 30, 90);
            const stepSize = randRange(rng, 3, 12) * scaleF;
            const curve = randRange(rng, 0.005, 0.025);

            ctx.beginPath();
            ctx.moveTo(x, y);

            for (let s = 0; s < steps; s++) {
              const angle = Math.sin(x * 0.01 + s * 0.03) * 2
                          + Math.cos(y * 0.008 + s * 0.02) * 2
                          + curve * s;
              x += Math.cos(angle) * stepSize;
              y += Math.sin(angle) * stepSize;
              ctx.lineTo(x, y);
              if (x < -300 || x > W + 300 || y < -300 || y > H + 300) break;
            }

            ctx.strokeStyle = hsla(c, randRange(rng, 0.04, 0.15));
            ctx.lineWidth = config.lineWeight * randRange(rng, 0.5, 1.5) * scaleF;
            ctx.stroke();
          }
        }

        // ============================================
        //  STYLE 7: WAVE PARTICLES
        // ============================================
        if (config.style === 'wave-particles' || rng() > 0.5) {
          const count = config.particleCount;
          const scaleF = W / BASE_W;

          for (let i = 0; i < count; i++) {
            const c = palette[i % palette.length];
            const t = i / count;

            const waveX = (t * W * 1.2) - W * 0.1;
            const amplitude = H * 0.3;
            const frequency = 2 + rng() * 4;
            const waveY = CY + Math.sin(waveX * 0.006 * frequency + rng() * 10) * amplitude * 0.6
                        + Math.cos(waveX * 0.003 + rng() * 5) * amplitude * 0.4;

            const px = waveX + randRange(rng, -60, 60) * scaleF;
            const py = waveY + randRange(rng, -80, 80) * scaleF;
            const size = randRange(rng, 1, 6) * scaleF;

            ctx.beginPath();
            ctx.arc(px, py, size, 0, Math.PI * 2);
            ctx.fillStyle = hsla(c, randRange(rng, 0.15, 0.7));
            ctx.fill();

            if (rng() > 0.94) {
              ctx.beginPath();
              ctx.strokeStyle = hsla(c, 0.5);
              ctx.lineWidth = 1 * scaleF;
              ctx.moveTo(px - size * 5, py);
              ctx.lineTo(px + size * 5, py);
              ctx.moveTo(px, py - size * 5);
              ctx.lineTo(px, py + size * 5);
              ctx.stroke();
            }
          }
        }

        // ============================================
        //  STYLE 8: CRYSTAL LATTICE
        // ============================================
        if (config.style === 'crystal-lattice' || rng() > 0.55) {
          const gridSize = config.latticeSize;
          const cellW = W / gridSize;
          const cellH = H / gridSize;
          const nodes = [];
          const scaleF = W / BASE_W;

          for (let gy = 0; gy <= gridSize; gy++) {
            for (let gx = 0; gx <= gridSize; gx++) {
              nodes.push({
                x: gx * cellW + Math.sin(gy * 0.5) * 8 * scaleF,
                y: gy * cellH + Math.cos(gx * 0.5) * 8 * scaleF
              });
            }
          }

          for (let i = 0; i < nodes.length; i++) {
            const n1 = nodes[i];
            const connections = randInt(rng, 1, 4);

            for (let k = 0; k < connections; k++) {
              const j = randInt(rng, 0, nodes.length - 1);
              if (j === i) continue;
              const n2 = nodes[j];
              const dist = Math.hypot(n1.x - n2.x, n1.y - n2.y);
              if (dist > cellW * 2.5) continue;

              const c = palette[(i + k) % palette.length];
              ctx.beginPath();
              ctx.moveTo(n1.x, n1.y);
              ctx.lineTo(n2.x, n2.y);
              ctx.strokeStyle = hsla(c, randRange(rng, 0.05, 0.15));
              ctx.lineWidth = config.lineWeight * 0.7 * scaleF;
              ctx.stroke();
            }
          }

          nodes.forEach((n, i) => {
            if (rng() > 0.6) {
              const c = palette[i % palette.length];
              ctx.beginPath();
              ctx.arc(n.x, n.y, randRange(rng, 1, 4) * scaleF, 0, Math.PI * 2);
              ctx.fillStyle = hsla(c, 0.3);
              ctx.fill();
            }
          });
        }

        // ============================================
        //  HERO SHAPE
        // ============================================
        const scaleF = W / BASE_W;
        const heroRadius = Math.min(W, H) * randRange(rng, 0.18, 0.32);
        const heroSides = config.heroSides;
        const heroRot = rng() * Math.PI * 2;
        const heroC = palette[0];

        const isStar = rng() > 0.5;
        let heroPts;
        if (isStar) {
          heroPts = starShapePoints(CX, CY, heroRadius, heroRadius * randRange(rng, 0.35, 0.6), heroSides, heroRot);
        } else {
          heroPts = polygonPoints(CX, CY, heroRadius, heroSides, heroRot);
        }

        drawPolyPath(heroPts, true);
        ctx.strokeStyle = hsla(heroC, 0.4);
        ctx.lineWidth = config.lineWeight * 3 * scaleF;
        ctx.stroke();

        if (config.useGradientFill) {
          const hg = ctx.createRadialGradient(CX, CY, heroRadius * 0.1, CX, CY, heroRadius);
          hg.addColorStop(0, hsla(heroC, 0.08));
          hg.addColorStop(0.7, hsla(heroC, 0.03));
          hg.addColorStop(1, hsla(heroC, 0));
          drawPolyPath(heroPts, true);
          ctx.fillStyle = hg;
          ctx.fill();
        }

        heroPts.forEach((p, idx) => {
          const c = palette[idx % palette.length];
          ctx.beginPath();
          ctx.arc(p.x, p.y, randRange(rng, 3, 7) * scaleF, 0, Math.PI * 2);
          ctx.fillStyle = hsla(c, 0.6);
          ctx.fill();
        });

        // ============================================
        //  INNER ACCENT SHAPES
        // ============================================
        const accentCount = randInt(rng, 4, 10);
        for (let a = 0; a < accentCount; a++) {
          const angle = (a / accentCount) * Math.PI * 2 + rng() * 0.5;
          const dist = heroRadius * randRange(rng, 0.8, 1.4);
          const ax = CX + Math.cos(angle) * dist;
          const ay = CY + Math.sin(angle) * dist;
          const size = randRange(rng, 15, 60) * scaleF;
          const sides = randInt(rng, 3, 7);
          const c = palette[(a + 2) % palette.length];

          const pts = polygonPoints(ax, ay, size, sides, rng() * Math.PI);
          drawPolyPath(pts, true);
          ctx.strokeStyle = hsla(c, 0.2);
          ctx.lineWidth = config.lineWeight * 1.2 * scaleF;
          ctx.stroke();
        }

        // ============================================
        //  SCATTERED PARTICLES
        // ============================================
        const scatterCount = randInt(rng, 200, 500);
        for (let i = 0; i < scatterCount; i++) {
          const x = rng() * W;
          const y = rng() * H;
          const size = randRange(rng, 0.5, 2.5) * scaleF;
          const c = palette[randInt(rng, 0, palette.length - 1)];
          const alpha = randRange(rng, 0.05, 0.4);

          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fillStyle = hsla(c, alpha);
          ctx.fill();
        }

        // ============================================
        //  VIGNETTE + CORNER GLOW
        // ============================================
        const vignette = ctx.createRadialGradient(CX, CY, W * 0.25, CX, CY, W * 0.85);
        vignette.addColorStop(0, 'rgba(0,0,0,0)');
        vignette.addColorStop(1, 'rgba(0,0,0,0.55)');
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, W, H);

        const glowCorner = pick(rng, [[0,0], [W,0], [0,H], [W,H], [CX,0], [0,CY], [W,CY], [CX,H]]);
        const cornerGlow = ctx.createRadialGradient(glowCorner[0], glowCorner[1], 50 * scaleF, glowCorner[0], glowCorner[1], W * 0.6);
        cornerGlow.addColorStop(0, hsla(palette[1], 0.07));
        cornerGlow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = cornerGlow;
        ctx.fillRect(0, 0, W, H);
      }

      // =============================================
      //  SEED MANAGEMENT
      // =============================================
      let currentSeed = Math.floor(Math.random() * 1000000);
      const seedLabel = document.getElementById('seedLabel');

      function updateSeedDisplay(seed) {
        seedLabel.textContent = 'SEED · ' + String(seed).padStart(6, '0');
      }

      function render(seed) {
        updateSeedDisplay(seed);
        generateArt(seed);
      }

      // Initial render
      render(currentSeed);

      // Refresh button
      document.getElementById('refreshBtn').addEventListener('click', () => {
        currentSeed = Math.floor(Math.random() * 1000000);
        render(currentSeed);
      });

      // =============================================
      //  HIGH-RES DOWNLOAD (4x = 4800×4800)
      // =============================================
      document.getElementById('downloadBtn').addEventListener('click', () => {
        const downloadBtn = document.getElementById('downloadBtn');
        const originalText = downloadBtn.textContent;
        downloadBtn.disabled = true;
        downloadBtn.textContent = '⏳ rendering...';

        // Small delay so the UI updates before the heavy synchronous render
        setTimeout(() => {
          try {
            const SCALE = 4;

            // Save current canvas & context
            const savedCanvas = canvas;
            const savedCtx = ctx;

            // Create high-res offscreen canvas
            const hiResCanvas = document.createElement('canvas');
            hiResCanvas.width = BASE_W * SCALE;
            hiResCanvas.height = BASE_H * SCALE;
            const hiResCtx = hiResCanvas.getContext('2d', { alpha: false });

            // Swap module-scoped canvas/ctx so generateArt renders to hi-res
            canvas = hiResCanvas;
            ctx = hiResCtx;

            // Re-render the same seed at high resolution
            generateArt(currentSeed);

            // Restore original canvas/ctx
            canvas = savedCanvas;
            ctx = savedCtx;

            // Export hi-res canvas as PNG
            hiResCanvas.toBlob((blob) => {
              if (!blob) {
                throw new Error('toBlob returned null');
              }

              const url = URL.createObjectURL(blob);
              const link = document.createElement('a');
              const seedStr = String(currentSeed).padStart(6, '0');
              link.download = `chromatic-morphs-seed-${seedStr}-${SCALE}x.png`;
              link.href = url;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);

              // Clean up object URL
              setTimeout(() => URL.revokeObjectURL(url), 1000);

              downloadBtn.disabled = false;
              downloadBtn.textContent = originalText;
            }, 'image/png');

          } catch (err) {
            console.error('Download failed:', err);
            alert('Failed to generate high-res image. Please try again.');
            downloadBtn.disabled = false;
            downloadBtn.textContent = originalText;
          }
        }, 60);
      });
    })();
  </script>
</body>
</html>
